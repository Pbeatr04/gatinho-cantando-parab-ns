<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feliz Aniversário!</title>
  <style>
    /* ================= CORES GERAIS =================
       Altere estas variaveis para mudar o tema inteiro:
       --gold e --gold-deep = tons dourados da luz
       --scroll-paper = cor do pergaminho aberto
       --scroll-ink = cor do texto escrito no pergaminho
    */
    :root {
      --bg-dark: #0b0d12;
      --gold: #ffd54f;
      --gold-deep: #f59e0b;
      --box-main: #1d78e1;
      --box-dark: #1d78e1;
      --ribbon: #4424fb;
      --scroll-paper: #fdf6e3;
      --scroll-ink: #2c1d11;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* MUDE AQUI: cores do fundo da pagina.
         A primeira cor cria o circulo central claro.
         A segunda cor cria o fundo externo. */
      min-height: 100vh;
      background: #ff0000;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      text-align: center;
      padding: 24px;
    }

    .hint {
      /* MUDE AQUI: cor e transparencia da dica no fim da tela */
      position: fixed;
      bottom: 28px;
      font-size: 0.95rem;
      color: #effaff;
      letter-spacing: 0.3px;
      transition: opacity 0.4s ease;
      pointer-events: none;
      text-shadow:
        0 1px 2px rgba(29, 78, 216, 0.55),
        0 0 12px rgba(255, 255, 255, 0.95);
    }

    /* ================= CAIXA DE PRESENTE ================= */
    .gift-scene {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .gift-box {
      position: relative;
      width: 230px;
      height: 205px;
      transition: transform 0.3s ease, opacity 0.5s ease;
    }

    /* Sombras claras nas laterais da caixa */
    .gift-box::before,
    .gift-box::after {
      content: "";
      position: absolute;
      top: 35px;
      width: 44px;
      height: 155px;
      border-radius: 50%;
      pointer-events: none;
      z-index: -1;
      filter: blur(18px);
    }

    .gift-box::before {
      left: -8px;
      background: rgba(29, 120, 225, 0.38);
      box-shadow:
        -14px 20px 30px rgba(29, 78, 216, 0.30),
        -8px 0 24px rgba(255, 255, 255, 0.70),
        0 0 16px rgba(109, 210, 253, 0.55);
    }

    .gift-box::after {
      right: -8px;
      background: rgba(68, 36, 251, 0.30);
      box-shadow:
        14px 20px 30px rgba(68, 36, 251, 0.30),
        8px 0 24px rgba(255, 255, 255, 0.66),
        0 0 16px rgba(109, 210, 253, 0.50);
    }

    .gift-box.hidden {
      opacity: 0;
      transform: scale(0.7);
      pointer-events: none;
      position: absolute;
    }

    .box-body {
      position: absolute;
      bottom: 0;
      left: 20px;
      width: 190px;
      height: 155px;
      background: linear-gradient(145deg, var(--box-main), var(--box-dark));
      border-radius: 0 0 14px 14px;
      box-shadow:
        0 20px 34px rgba(29, 78, 216, 0.22),
        0 6px 18px rgba(109, 210, 253, 0.28),
        inset 10px 0 22px rgba(109, 210, 253, 0.16),
        inset -10px 0 22px rgba(68, 36, 251, 0.10);
      overflow: hidden;
    }

    .box-body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      /* --ribbon controla a cor da faixa vertical da caixa */
      background: var(--ribbon);
    }

    .box-lid {
      position: absolute;
      top: 18px;
      left: 10px;
      width: 210px;
      height: 46px;
      /* --box-main controla a tampa principal */
      background: linear-gradient(145deg, var(--box-main), var(--box-dark));
      border-radius: 10px;
      box-shadow:
        0 10px 22px rgba(29, 78, 216, 0.20),
        0 0 14px rgba(109, 210, 253, 0.32),
        inset 0 4px 12px rgba(255, 255, 255, 0.12);
      transform-origin: left bottom;
      transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
      z-index: 2;
    }

    .box-lid::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28px;
      height: 100%;
      /* --ribbon controla a faixa vertical da tampa */
      background: var(--ribbon);
    }

    .bow {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      width: 84px;
      height: 32px;
      z-index: 3;
    }

    .bow::before,
    .bow::after {
      content: "";
      position: absolute;
      top: 2px;
      width: 40px;
      height: 28px;
      /* --ribbon controla a cor do laço */
      border: 5px solid var(--ribbon);
      border-radius: 50% 50% 10% 50%;
    }

    .bow::before {
      left: 0;
      transform: rotate(-15deg);
    }

    .bow::after {
      right: 0;
      transform: scaleX(-1) rotate(-15deg);
    }

    /* Vibração 2 vezes */
    @keyframes vibrateTwice {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      10% { transform: translateX(-8px) rotate(-2deg); }
      20% { transform: translateX(8px) rotate(2deg); }
      30% { transform: translateX(-7px) rotate(-2deg); }
      40% { transform: translateX(0) rotate(0deg); }
      55% { transform: translateX(0) rotate(0deg); }
      65% { transform: translateX(-9px) rotate(-2.5deg); }
      75% { transform: translateX(9px) rotate(2.5deg); }
      85% { transform: translateX(-6px) rotate(-1.5deg); }
      92% { transform: translateX(6px) rotate(1.5deg); }
    }

    .gift-box.vibrating {
      animation: vibrateTwice 0.95s ease-in-out forwards;
    }

    .gift-box.opening .box-lid {
      transform: translate(-35px, -95px) rotate(-38deg);
      opacity: 0;
    }

    /* ================= LUZ AMARELA DOURADA ================= */
    .golden-aura {
      position: fixed;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 250, 205, 1) 0%,
        rgba(255, 213, 79, 0.85) 35%,
        rgba(245, 158, 11, 0.35) 65%,
        rgba(245, 158, 11, 0) 100%
      );
      filter: blur(8px);
      opacity: 0;
      transform: scale(0.3);
      pointer-events: none;
      transition: opacity 0.7s ease, transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1;
    }

    .golden-aura.active {
      opacity: 1;
      transform: scale(3.6);
      box-shadow: 0 0 90px 35px rgba(255, 215, 64, 0.55);
    }

    /* ================= PERGAMINHO (CANUDO DO KUNG FU PANDA) ================= */
    .scroll-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      animation: fadeInScroll 0.8s ease forwards;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .scroll-wrapper.visible {
      display: flex;
    }

    @keyframes fadeInScroll {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Canudo fechado */
    .scroll-tube {
      position: relative;
      width: 240px;
      height: 54px;
      border-radius: 27px;
      background: linear-gradient(
        90deg,
        #b47b38 0%,
        #f3d28d 22%,
        #fff7db 48%,
        #e2b25e 76%,
        #9e6627 100%
      );
      box-shadow:
        0 0 28px rgba(255, 213, 79, 0.75),
        0 14px 30px rgba(0, 0, 0, 0.65);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      transition: transform 0.3s ease;
    }

    .scroll-tube:hover {
      transform: scale(1.04);
    }

    .scroll-end-cap {
      width: 18px;
      height: 46px;
      border-radius: 10px;
      background: linear-gradient(180deg, #fcd34d, #b45309);
      box-shadow: inset 0 0 4px rgba(255, 255, 255, 0.6);
    }

    .scroll-ribbon-band {
      width: 18px;
      height: 100%;
      background: linear-gradient(180deg, #ef4444, #991b1b);
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.5);
    }

    /* Pergaminho aberto */
    .scroll-unrolled {
      display: none;
      position: relative;
      width: min(90vw, 440px);
      min-height: 240px;
      padding: 36px 28px;
      background: linear-gradient(180deg, #fffaf0 0%, var(--scroll-paper) 50%, #f3e4c3 100%);
      color: var(--scroll-ink);
      border-radius: 10px;
      box-shadow:
        0 0 45px rgba(255, 213, 79, 0.75),
        0 20px 50px rgba(0, 0, 0, 0.7);
      border-top: 10px solid #d4a359;
      border-bottom: 10px solid #d4a359;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      transform-origin: center;
      animation: unroll 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes unroll {
      0% {
        opacity: 0;
        transform: scaleX(0.25) scaleY(0.7);
      }
      100% {
        opacity: 1;
        transform: scaleX(1) scaleY(1);
      }
    }

    .scroll-wrapper.opened .scroll-tube {
      display: none;
    }

    .scroll-wrapper.opened .scroll-unrolled {
      display: flex;
    }

    .dragon-tag {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #9a5b13;
      font-weight: 700;
    }

    .birthday-message {
      font-size: clamp(1.45rem, 4.5vw, 2.05rem);
      font-weight: 800;
      line-height: 1.3;
      color: #2c1d11;
    }

    .sparkles {
      font-size: 1.4rem;
      letter-spacing: 6px;
    }

  </style>
</head>
<body>
  <div class="golden-aura" id="goldenAura"></div>

  <!-- Etapa 1: Caixa de presente -->
  <div class="gift-scene" id="giftScene" role="button" tabindex="0" aria-label="Abrir presente">
    <div class="gift-box" id="giftBox">
      <div class="box-lid">
        <div class="bow"></div>
      </div>
      <div class="box-body"></div>
    </div>
  </div>

  <!-- Etapa 2 e 3: Canudo do Kung Fu Panda e mensagem -->
  <div class="scroll-wrapper" id="scrollWrapper" role="button" tabindex="0" aria-label="Abrir pergaminho">
    <div class="scroll-tube" id="scrollTube">
      <div class="scroll-end-cap"></div>
      <div class="scroll-ribbon-band"></div>
      <div class="scroll-end-cap"></div>
    </div>

    <div class="scroll-unrolled" id="scrollUnrolled">
      <span class="dragon-tag">pergaminho do dragão</span>
      <p class="birthday-message">Obrigada por ser vc.😊<br />Feliz aniversárioooo!</p>
      <div class="sparkles">✨ 🥟 ✨</div>
    </div>
  </div>

  <p class="hint" id="hintText">Toque na caixa de presente</p>

  <script>
    const giftScene = document.getElementById("giftScene");
    const giftBox = document.getElementById("giftBox");
    const goldenAura = document.getElementById("goldenAura");
    const scrollWrapper = document.getElementById("scrollWrapper");
    const hintText = document.getElementById("hintText");

    let stage = "gift"; // "gift" -> "animating" -> "tube" -> "opened"

    function openGiftFlow() {
      if (stage !== "gift") return;
      stage = "animating";
      hintText.style.opacity = "0";

      // 1. Vibra duas vezes
      giftBox.classList.add("vibrating");

      giftBox.addEventListener(
        "animationend",
        () => {
          // 2. Abre a tampa da caixa
          giftBox.classList.remove("vibrating");
          giftBox.classList.add("opening");

          // 3. Luz amarela dourada aparece
          setTimeout(() => {
            goldenAura.classList.add("active");
          }, 250);

          // 4. Caixa some e o canudo aparece
          setTimeout(() => {
            giftBox.classList.add("hidden");
            giftScene.style.display = "none";
            scrollWrapper.classList.add("visible");
            stage = "tube";

            hintText.textContent = "Toque no pergaminho para abrir";
            hintText.style.opacity = "1";
          }, 850);
        },
        { once: true }
      );
    }

    function openScrollFlow() {
      if (stage !== "tube") return;
      stage = "opened";
      hintText.style.opacity = "0";
      scrollWrapper.classList.add("opened");
    }

    giftScene.addEventListener("click", openGiftFlow);
    giftScene.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openGiftFlow();
      }
    });

    scrollWrapper.addEventListener("click", openScrollFlow);
    scrollWrapper.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        openScrollFlow();
      }
    });
  </script>
</body>
</html>
