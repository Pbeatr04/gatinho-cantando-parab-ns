<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gatinho Parabéns ao Clique</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #0b0d12;
      color: #f4f6fb;
      font-family: system-ui, -apple-system, sans-serif;
    }

    .container {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .cat-button {
      width: 260px;
      height: 260px;
      border-radius: 24px;
      border: 2px solid #262b38;
      background: #141821;
      cursor: pointer;
      overflow: hidden;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cat-button:hover {
      border-color: #22d3ee;
    }

    .cat-button.singing {
      transform: scale(1.04);
      border-color: #22d3ee;
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
    }

    .cat-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      user-select: none;
      pointer-events: none;
    }

    .hint {
      font-size: 0.95rem;
      color: #9aa5b8;
    }
  </style>
</head>
<body>
  <main class="container">
    <button id="catBtn" class="cat-button" type="button" aria-label="Clicar no gatinho para tocar a próxima nota">
      <img id="catImg" src="gato-fechado.jpg" alt="Gatinho de boca fechada" />
    </button>
    <p id="hintText" class="hint">Clique para tocar</p>
  </main>

  <script>
    const catBtn = document.getElementById("catBtn");
    const catImg = document.getElementById("catImg");
    const hintText = document.getElementById("hintText");

    // Sequência de notas de "Parabéns pra você": [frequência em Hz, duração em segundos]
    const notes = [
      [261.63, 0.28],
      [261.63, 0.20],
      [293.66, 0.45],
      [261.63, 0.45],
      [349.23, 0.45],
      [329.63, 0.75],

      [261.63, 0.28],
      [261.63, 0.20],
      [293.66, 0.45],
      [261.63, 0.45],
      [392.00, 0.45],
      [349.23, 0.75],

      [261.63, 0.28],
      [261.63, 0.20],
      [523.25, 0.45],
      [440.00, 0.45],
      [349.23, 0.45],
      [329.63, 0.45],
      [293.66, 0.75],

      [466.16, 0.28],
      [466.16, 0.20],
      [440.00, 0.45],
      [349.23, 0.45],
      [392.00, 0.45],
      [349.23, 0.90]
    ];

    let audioCtx = null;
    let currentIndex = 0;
    let closeMouthTimer = null;

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playNextNote() {
      const [freq, dur] = notes[currentIndex];
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.02);

      // Abre a boca enquanto toca a nota
      clearTimeout(closeMouthTimer);
      catImg.src = "gato-aberto.jpg";
      catImg.alt = "Gatinho cantando de boca aberta";
      catBtn.classList.add("singing");

      const isLastNote = currentIndex === notes.length - 1;
      hintText.textContent = isLastNote ? "Final! Próximo clique recomeça" : "Continue clicando...";

      closeMouthTimer = setTimeout(() => {
        catImg.src = "gato-fechado.jpg";
        catImg.alt = "Gatinho de boca fechada";
        catBtn.classList.remove("singing");
      }, dur * 1000 * 0.85);

      currentIndex = (currentIndex + 1) % notes.length;
    }

    catBtn.addEventListener("click", playNextNote);
  </script>
</body>
</html>
