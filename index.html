<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Surpresa!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: #111317;
      color: #f4f6fb;
      font-family: system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .tela {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      gap: 16px;
    }

    .tela.ativa {
      display: flex;
    }

    /* --- Tela do presente --- */
    #presente {
      width: 180px;
      cursor: pointer;
      image-rendering: pixelated;
      filter:
        drop-shadow(0 18px 16px rgba(139, 92, 246, 0.35))
        drop-shadow(0 8px 10px rgba(0, 0, 0, 0.75));
      transition: transform 0.1s, filter 0.2s ease;
    }

    #presente:hover {
      transform: scale(1.05);
      filter:
        drop-shadow(0 22px 20px rgba(139, 92, 246, 0.48))
        drop-shadow(0 10px 12px rgba(0, 0, 0, 0.82));
    }

    @keyframes vibrar {
      0%   { transform: translate(0, 0) rotate(0deg); }
      20%  { transform: translate(-6px, 0) rotate(-6deg); }
      40%  { transform: translate(6px, 0) rotate(6deg); }
      60%  { transform: translate(-6px, 0) rotate(-4deg); }
      80%  { transform: translate(6px, 0) rotate(4deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .animar-vibracao {
      animation: vibrar 0.4s ease-in-out;
    }

    #status {
      font-size: 0.9rem;
      color: #94a3b8;
      text-align: center;
    }

    /* --- Tela do gatinho --- */
    .cat-button {
      width: 260px;
      height: 260px;
      border-radius: 24px;
      border: 2px solid #262b38;
      background: #141821;
      cursor: pointer;
      overflow: hidden;
      display: grid;
      place-items: center;
      transition: transform 0.1s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .cat-button:hover {
      border-color: #22d3ee;
    }

    .cat-button.singing {
      transform: scale(1.04);
      border-color: #22d3ee;
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
    }

    .cat-button img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    .hint {
      font-size: 0.95rem;
      color: #9aa5b8;
      text-align: center;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #262b38;
      color: #9aa5b8;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: color 0.15s ease, border-color 0.15s ease;
    }

    .reset-btn:hover {
      color: #f4f6fb;
      border-color: #22d3ee;
    }
  </style>
</head>
<body>

  <!-- Tela 1: Caixa de presente -->
  <section id="telaPresente" class="tela ativa">
    <img id="presente" src="presente.png" alt="Caixa de presente" />
    <p id="status">Clique para balançar (3 cliques para abrir)</p>
  </section>

  <!-- Tela 2: Gatinho cantando parabéns -->
  <main id="telaGatinho" class="tela">
    <button id="catBtn" class="cat-button" type="button" aria-label="Clicar no gatinho para tocar a próxima nota">
      <img id="catImg" src="gato-fechado.jpg" alt="Gatinho de boca fechada" />
    </button>
    <p id="hintText" class="hint">Clique para tocar</p>
    <button id="voltarBtn" class="reset-btn" type="button">Fechar caixa de novo</button>
  </main>

  <script>
    // --- Controle da caixa de presente ---
    const telaPresente = document.getElementById("telaPresente");
    const telaGatinho = document.getElementById("telaGatinho");
    const presente = document.getElementById("presente");
    const statusTexto = document.getElementById("status");
    const voltarBtn = document.getElementById("voltarBtn");

    let cliques = 0;
    const cliquesNecessarios = 3;

    function dispararVibracao() {
      presente.classList.remove("animar-vibracao");
      void presente.offsetWidth;
      presente.classList.add("animar-vibracao");
    }

    presente.addEventListener("click", () => {
      cliques++;
      dispararVibracao();

      const restantes = cliquesNecessarios - cliques;

      if (restantes > 0) {
        statusTexto.textContent = `Faltam ${restantes} ${restantes === 1 ? "clique" : "cliques"} para abrir!`;
      } else {
        statusTexto.textContent = "Abrindo surpresa...";
        cliques = 0;

        setTimeout(() => {
          telaPresente.classList.remove("ativa");
          telaGatinho.classList.add("ativa");
          statusTexto.textContent = "Clique para balançar (3 cliques para abrir)";
        }, 250);
      }
    });

    voltarBtn.addEventListener("click", () => {
      clearTimeout(closeMouthTimer);
      catImg.src = "gato-fechado.jpg";
      catImg.alt = "Gatinho de boca fechada";
      catBtn.classList.remove("singing");
      currentIndex = 0;
      hintText.textContent = "Clique para tocar";

      telaGatinho.classList.remove("ativa");
      telaPresente.classList.add("ativa");
    });

    // --- Controle do gatinho cantando ---
    const catBtn = document.getElementById("catBtn");
    const catImg = document.getElementById("catImg");
    const hintText = document.getElementById("hintText");

    // Sequência de notas de "Parabéns pra você": [frequência em Hz, duração em segundos]
    const notes = [
      [261.63, 0.28],
      [261.63, 0.20],
      [293.66, 0.45],
      [261.63, 0.45],
      [349.23, 0.45],
      [329.63, 0.75],

      [261.63, 0.28],
      [261.63, 0.20],
      [293.66, 0.45],
      [261.63, 0.45],
      [392.00, 0.45],
      [349.23, 0.75],

      [261.63, 0.28],
      [261.63, 0.20],
      [523.25, 0.45],
      [440.00, 0.45],
      [349.23, 0.45],
      [329.63, 0.45],
      [293.66, 0.75],

      [466.16, 0.28],
      [466.16, 0.20],
      [440.00, 0.45],
      [349.23, 0.45],
      [392.00, 0.45],
      [349.23, 0.90]
    ];

    let audioCtx = null;
    let currentIndex = 0;
    let closeMouthTimer = null;

    function getAudioContext() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx) {
        audioCtx = new AudioContextClass();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playNextNote() {
      const [freq, dur] = notes[currentIndex];
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start(now);
      osc.stop(now + dur + 0.02);

      clearTimeout(closeMouthTimer);
      catImg.src = "gato-aberto.jpg";
      catImg.alt = "Gatinho cantando de boca aberta";
      catBtn.classList.add("singing");

      const isLastNote = currentIndex === notes.length - 1;
      hintText.textContent = isLastNote ? "Final! Próximo clique recomeça" : "Continue clicando...";

      closeMouthTimer = setTimeout(() => {
        catImg.src = "gato-fechado.jpg";
        catImg.alt = "Gatinho de boca fechada";
        catBtn.classList.remove("singing");
      }, dur * 1000 * 0.85);

      currentIndex = (currentIndex + 1) % notes.length;
    }

    catBtn.addEventListener("click", playNextNote);
  </script>
</body>
</html>
